name: hadolint

# Bespoke: dockerfile linter for this image-publishing repo. The
# canonical hygiene group covers commits/PR-metadata/drift/renovate
# but not Dockerfile linting (no canonical group for it yet).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  installer-tests:
    runs-on: ${{ fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/test-ci-tools.py

  hadolint:
    uses: jr200-labs/github-action-templates/.github/workflows/lint_docker.yaml@master
    with:
      recursive: true
      runner: ${{ fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
